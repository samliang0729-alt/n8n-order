<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增與編輯訂單 | Enterprise Order Form</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-page: #f8fafc;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --border-hover: #cbd5e1;
            
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --primary-border: #bfdbfe;
            
            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-sub: #475569;
            
            --success: #16a34a;
            --success-light: #f0fdf4;
            --danger: #dc2626;
            --danger-light: #fef2f2;
            
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1.5rem;
            line-height: 1.5;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        /* 導覽列 */
        header {
            margin-bottom: 2rem;
        }

        .nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card);
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            margin-bottom: 1.5rem;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--primary);
        }

        .brand-logo svg {
            width: 24px;
            height: 24px;
            fill: var(--primary);
        }

        .nav-menu {
            display: flex;
            gap: 0.5rem;
        }

        .nav-tab {
            padding: 0.5rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-sub);
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .nav-tab:hover {
            background-color: #f1f5f9;
            color: var(--text-main);
        }

        .nav-tab.active {
            background-color: var(--primary-light);
            color: var(--primary);
            font-weight: 600;
        }

        /* 表單卡片 */
        .card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            padding: 2rem;
            margin-bottom: 1.5rem;
        }

        .card-header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .form-mode-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .mode-badge {
            font-size: 0.775rem;
            padding: 0.25rem 0.65rem;
            border-radius: 20px;
            font-weight: 600;
        }

        .mode-badge.create {
            background-color: var(--primary-light);
            color: var(--primary);
            border: 1px solid var(--primary-border);
        }

        .mode-badge.edit {
            background-color: #fef3c7;
            color: #b45309;
            border: 1px solid #fde68a;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.25rem;
        }

        @media (max-width: 640px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-sub);
        }

        .form-label span.req {
            color: var(--danger);
        }

        .input-control {
            width: 100%;
            height: 42px;
            padding: 0 0.85rem;
            font-size: 0.95rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background-color: #ffffff;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }

        .input-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .action-row {
            margin-top: 1.75rem;
            display: flex;
            gap: 1rem;
        }

        .btn {
            height: 44px;
            padding: 0 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: var(--radius-md);
            border: 1px solid transparent;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
        }

        .btn-primary {
            flex: 2;
            background-color: var(--primary);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            flex: 1;
            background-color: #ffffff;
            border-color: var(--border-color);
            color: var(--text-sub);
        }

        .btn-secondary:hover {
            background-color: #f8fafc;
            color: var(--text-main);
        }

        /* 提示通知條 */
        .alert-banner {
            display: none;
            padding: 0.85rem 1.25rem;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            margin-bottom: 1.25rem;
            font-weight: 500;
        }

        .alert-banner.success {
            display: block;
            background-color: var(--success-light);
            border: 1px solid #bbf7d0;
            color: var(--success);
        }

        .alert-banner.error {
            display: block;
            background-color: var(--danger-light);
            border: 1px solid #fecaca;
            color: var(--danger);
        }

        /* 網址設定收合卡片 */
        .config-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            margin-top: 1.5rem;
        }

        .config-header {
            padding: 0.65rem 1rem;
            background: #f8fafc;
            cursor: pointer;
            font-size: 0.825rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .config-body {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            border-top: 1px solid var(--border-color);
        }

        .config-card.collapsed .config-body {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 頂部導覽列 -->
        <header>
            <div class="nav-bar">
                <div class="brand-logo">
                    <svg viewBox="0 0 24 24">
                        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/>
                    </svg>
                    訂單管理系統 Enterprise
                </div>
                <div class="nav-menu">
                    <a href="order_query_get.html" class="nav-tab">訂單查詢列表</a>
                    <a href="member_order_create.html" class="nav-tab active">新增 / 編輯訂單</a>
                </div>
            </div>
        </header>

        <!-- 狀態通知 Banner -->
        <div id="alertBanner" class="alert-banner"></div>

        <!-- 表單卡片 -->
        <div class="card">
            <div class="card-header-bar">
                <div class="form-mode-title">
                    <span id="formTitleText">新增訂單資料</span>
                    <span id="modeBadge" class="mode-badge create">新增模式 (Append)</span>
                </div>
                <button type="button" id="clearEditBtn" class="btn btn-secondary" style="height:32px; font-size:0.8rem; display:none;" onclick="cancelEditMode()">
                    切換回新增模式
                </button>
            </div>

            <form id="orderForm" onsubmit="handleSubmit(event)">
                <div class="form-grid">
                    
                    <div class="form-group">
                        <label class="form-label" for="ORD_id">訂單編號 (ORD_id) <span class="req">*</span></label>
                        <input type="text" id="ORD_id" class="input-control" placeholder="例: ORD-2026-301" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="CUST_id">客戶編號 (CUST_id) <span class="req">*</span></label>
                        <input type="text" id="CUST_id" class="input-control" placeholder="例: CUST-2026-001" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="user_id">會員名稱 (user_id) <span class="req">*</span></label>
                        <input type="text" id="user_id" class="input-control" placeholder="例: 黃芳瑜" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="Email">電子郵件 (Email) <span class="req">*</span></label>
                        <input type="email" id="Email" class="input-control" placeholder="例: wzll1p@gmail.com" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="commodity">購買商品 (commodity) <span class="req">*</span></label>
                        <input type="text" id="commodity" class="input-control" placeholder="例: 人體工學滑鼠" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="Purchase_amount">購買金額 (Purchase amount) <span class="req">*</span></label>
                        <input type="number" id="Purchase_amount" class="input-control" placeholder="例: 1600" min="0" step="any" required>
                    </div>

                </div>

                <div class="action-row">
                    <button type="button" class="btn btn-secondary" onclick="resetForm()">重設內容</button>
                    <button type="submit" id="submitBtn" class="btn btn-primary">
                        儲存 / 更新訂單資料 (POST)
                    </button>
                </div>
            </form>

            <!-- Webhook 設定收合卡片 -->
            <div id="configCard" class="config-card collapsed">
                <div class="config-header" onclick="document.getElementById('configCard').classList.toggle('collapsed')">
                    <span>⚙️ 編輯 / 新增 Webhook POST API Endpoint 設定</span>
                    <span>展開 / 收合</span>
                </div>
                <div class="config-body">
                    <input type="text" id="postApiUrl" class="input-control" style="font-family: monospace; font-size: 0.85rem;" value="https://85imwlob.roamerhost.com/webhook/438ecac1-1ffd-4b14-8433-063c1207ebd1">
                </div>
            </div>
        </div>

    </div>

    <script>
        // 頁面加載時檢查是否有從查詢頁面帶過來的「編輯資料」
        window.addEventListener('DOMContentLoaded', () => {
            const editDataStr = localStorage.getItem('editOrderData');
            if (editDataStr) {
                try {
                    const item = JSON.parse(editDataStr);
                    // 填入資料
                    document.getElementById('ORD_id').value = item['ORD_id'] || item['訂單ID'] || '';
                    document.getElementById('CUST_id').value = item['CUST_id'] || item['客戶ID'] || '';
                    document.getElementById('user_id').value = item['user_id'] || item['姓名'] || '';
                    document.getElementById('Email').value = item['Email'] || item['信箱'] || '';
                    document.getElementById('commodity').value = item['commodity'] || item['購買商品'] || '';
                    document.getElementById('Purchase_amount').value = item['Purchase amount'] || item['購買金額'] || '';

                    // 切換至編輯模式 UI
                    document.getElementById('formTitleText').textContent = '編輯訂單資料';
                    const badge = document.getElementById('modeBadge');
                    badge.textContent = '編輯模式 (Update)';
                    badge.className = 'mode-badge edit';
                    document.getElementById('clearEditBtn').style.display = 'inline-flex';

                    showAlert('已自動帶入欲編輯的訂單數據。完成修改後點擊「儲存 / 更新訂單資料」即可送出。', 'success');

                    // 清除 localStorage 以免重複載入
                    localStorage.removeItem('editOrderData');
                } catch (e) {
                    console.error('Parse edit data error:', e);
                }
            }
        });

        function cancelEditMode() {
            resetForm();
            document.getElementById('formTitleText').textContent = '新增訂單資料';
            const badge = document.getElementById('modeBadge');
            badge.textContent = '新增模式 (Append)';
            badge.className = 'mode-badge create';
            document.getElementById('clearEditBtn').style.display = 'none';
            showAlert('已切換回新增模式。', 'success');
        }

        function resetForm() {
            document.getElementById('orderForm').reset();
        }

        async function handleSubmit(event) {
            event.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const targetUrl = document.getElementById('postApiUrl').value.trim();

            const formData = new FormData();
            formData.append('ORD_id', document.getElementById('ORD_id').value.trim());
            formData.append('CUST_id', document.getElementById('CUST_id').value.trim());
            formData.append('user_id', document.getElementById('user_id').value.trim());
            formData.append('Email', document.getElementById('Email').value.trim());
            formData.append('commodity', document.getElementById('commodity').value.trim());
            formData.append('Purchase amount', document.getElementById('Purchase_amount').value.trim());

            submitBtn.disabled = true;
            submitBtn.textContent = '資料傳送中...';

            try {
                const response = await fetch(targetUrl, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    showAlert('✅ 訂單資料已成功儲存/更新！', 'success');
                } else {
                    showAlert(`⚠️ 伺服器回傳狀態碼: ${response.status}`, 'error');
                }
            } catch (error) {
                console.error('Submit error:', error);
                showAlert('已發送 POST 請求！(若提示跨域 CORS 錯誤，請確認 Webhook 節點是否有開啟 Header 權限)', 'success');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '儲存 / 更新訂單資料 (POST)';
            }
        }

        function showAlert(msg, type) {
            const banner = document.getElementById('alertBanner');
            banner.textContent = msg;
            banner.className = `alert-banner ${type}`;
        }
    </script>
</body>
</html>
